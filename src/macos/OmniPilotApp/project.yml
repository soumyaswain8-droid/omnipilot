name: OmniPilot
options:
  bundleIdPrefix: in.sidewall.omnipilot
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: in.sidewall.omnipilot
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  OmniPilot:
    type: application
    platform: macOS
    sources:
      - path: ../OmniPilot/Sources
        type: group
    settings:
      base:
        PRODUCT_NAME: OmniPilot
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: OmniPilot.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleName: OmniPilot
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: "OmniPilot needs microphone access to listen to your conversations, transcribe them locally, and build your personal memory. All audio is processed on-device — nothing is sent to the cloud."
        NSAppleEventsUsageDescription: "OmniPilot uses accessibility to register the global hotkey (Cmd+Shift+O) so you can quickly query your memories from anywhere."
    entitlements:
      path: OmniPilot.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.app-sandbox: false
    dependencies:
      - package: SQLite.swift
        product: SQLite
    postBuildScripts:
      - name: "Copy Whisper Model"
        script: |
          MODEL_SRC="${SRCROOT}/../../../models/ggml-small.en.bin"
          MODEL_DST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources"
          mkdir -p "$MODEL_DST"
          if [ -f "$MODEL_SRC" ]; then
            cp -n "$MODEL_SRC" "$MODEL_DST/" 2>/dev/null || true
            echo "Whisper model copied to app bundle"
          else
            echo "Warning: Whisper model not found at $MODEL_SRC"
          fi

packages:
  SQLite.swift:
    url: https://github.com/stephencelis/SQLite.swift.git
    from: "0.15.3"
